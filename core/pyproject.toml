[project]
name = "botata"
version = "0.1.0"
description = "Bot comunitario de Bluesky Argentina basado en agentes y grafos (langgraph)."
requires-python = ">=3.12"
dependencies = [
    # Orquestación de agentes
    "langgraph>=0.2.60",
    # Estructuración de datos / Structured Outputs
    "pydantic>=2.7",
    # Cliente LLM (OpenRouter es compatible con la API de OpenAI)
    "openai>=1.30",
    # Cliente Bluesky (AT Protocol)
    "atproto>=0.0.5",
    # Cliente Mastodon (canal T28)
    "Mastodon.py>=1.8",
    # Config / env
    "python-dotenv>=1.0",
    # Zona horaria IANA (America/Argentina/Buenos_Aires) — Windows no trae tzdata del SO
    "tzdata>=2024.1",
    # Persistencia: SQLite moderno + búsqueda semántica (vec0)
    "sqlite-vec>=0.1.6",
    # Embeddings locales multilingües (bge-m3)
    "sentence-transformers>=3.0",
    # (El scraping vive en la suite aparte 'Membrilla' — pablofprz/membrilla.
    #  Botata consume su salida por carpeta+sidecar, sin dependencias de scraping.)
    # Cliente MCP: conectores externos como tools (T29)
    "mcp>=1.28",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["botata", "db", "router", "tools", "skills", "moods", "routines", "scheduler", "mcp_tools", "mem_admin", "budget", "clearsky", "config_ui", "catalog", "parse_memory", "spotify_auth", "instance", "init_instance", "channels", "connectors"]

# --- ruff: tipado estricto, sin opinionated noise ---------------------------
[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]
ignore = ["E501"]  # line-length lo manejamos con formatter

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_module_defs = true
